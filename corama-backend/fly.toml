[app]
primary_region = "iad"

[build]

[env]
PORT = "8000"

[http_service]
internal_port = 8000
force_https = true
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 0
processes = ["app"]

[[vm]]
memory = "1024mb"
cpu_kind = "shared"
cpus = 1

[processes]
app = "fastapi run app/main.py --host 0.0.0.0 --port 8000"
