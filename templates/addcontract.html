{% include 'head.html' %}

<body>
    {% include 'navbar.html' %}

    <div class="container my-5">
        <div class="card">
            <div class="card-TitleHeader">
                <h2 class="text-center form-title">Add Contract To Contract Radar Maximizer</h2>
            </div>
            <br>
            <div class="form">
                <form method="post" action="/process_contract" enctype="multipart/form-data">
                    <div class="row mb-4">
                        <!-- First Column Fields -->
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="required" for="bidNumber">Bid Number</label>
                                <input type="text" class="form-control" id="bidNumber" name="bidNumber" required>
                            </div>
                            <div class="form-group">
                                <label class="required" for="bidName">Bid Name</label>
                                <input type="text" class="form-control" id="bidName" name="bidName" required>
                            </div>
                            <div class="form-group">
                                <label for="bidDescription">Bid Description</label>
                                <textarea class="form-control" id="bidDescription" name="bidDescription" rows="3"></textarea>
                            </div>
                            <div class="form-group">
                                <label class="required" for="status">Status</label>
                                <select class="form-control" id="status" name="status" required>
                                    <option value="open">Open</option>
                                    <option value="closed">Closed</option>
                                    <option value="pending">Pending</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="required" for="availableDate">Available Date</label>
                                <input type="date" class="form-control" id="availableDate" name="availableDate" required>
                            </div>
                            <div class="form-group">
                                <label class="required" for="dueDate">Due Date</label>
                                <input type="date" class="form-control" id="dueDate" name="dueDate" required>
                            </div>
                        </div>
                        <!-- Second Column Fields -->
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="required" for="category">Category</label>
                                <input type="text" class="form-control" id="category" name="category" required>
                            </div>
                            <div class="form-group">
                                <label class="required" for="industry">Industry</label>
                                <input type="text" class="form-control" id="industry" name="industry" required>
                            </div>
                            <div class="form-group">
                                <label for="budgetEstimate">Budget Estimate</label>
                                <input type="number" class="form-control" id="budgetEstimate" name="budgetEstimate">
                            </div>
                            <div class="form-group">
                                <label for="organization">Organization</label>
                                <input type="text" class="form-control" id="organization" name="organization">
                            </div>
                            <div class="form-group">
                                <label for="department">Department</label>
                                <input type="text" class="form-control" id="department" name="department">
                            </div>
                            <div class="form-group">
                                <label for="detailLink">Detail Link</label>
                                <input type="url" class="form-control" id="detailLink" name="detailLink">
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="isSmallBusiness" name="isSmallBusiness">
                                <label class="form-check-label" for="isSmallBusiness">Is Small Business Set Aside</label>
                            </div>
                            <div class="form-group mt-2">
                                <label for="projectDuration">Project Duration</label>
                                <input type="text" class="form-control" id="projectDuration" name="projectDuration">
                            </div>
                        </div>
                    </div>

                    <div class="card-TitleHeader">
                        <h2 class="text-center form-title">Upload Capability Statement</h2>
                        <div class="text-center">
                            <input type="file" id="capabilityStatement" name="capabilityStatement" accept=".pdf" style="display: none;" onchange="handleFileSelection()">
                            <button type="button" class="btn btn-compare mx-3" onclick="document.getElementById('capabilityStatement').click()">Upload</button>
                        </div>
                    </div>
                   
                    <button type="submit" class="btn btn-custom w-100 mt-3">Submit Contract</button>
                </form>
            </div>
        </div>
    </div>

    {% include 'scripts.html' %}
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        function handleFileSelection() {
            var fileInput = document.getElementById('capabilityStatement');
            var file = fileInput.files[0];
            if (file) {
                // You can add any additional logic here if needed
                console.log('File selected:', file.name);
            }
        }
    </script>
</body>
