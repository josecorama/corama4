				/>
			<title>{{ title | default('CORAMA.ai') }}</title>
			<style>
				@import url("https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Roboto:wght@400;500&display=swap");
				body {
				font-family: "Roboto", sans-serif;
				}
				.card {
				background-color: #274a70;
				border-radius: 15px;
				box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
				display: flex;
				flex-direction: column;
				align-items: center;
				/* Center align items horizontally */
				justify-content: center;
				/* Center align items vertically */
				padding: 0;
				height: 100%;
				}
				.form {
				background-color: white;
				padding: 25px;
				width: 100%;

				border-radius: 15px;
				z-index: 1px;
				}
				.card-TitleHeader {
				/* Ensure the image covers the entire area */
				background-position: center;
				/* Center the image */
				color: white;
				font-size: 50px;
				flex: 0 0 auto;
				border-radius: 15px 15px 0 0;
				/* Top corners rounded */
				width: 100%;
				/* Full width */
				text-align: center;
				/* Center text */
				padding: 20px;
				z-index: 0;
				}
				.form-title {
				color: white;
				font-family: "Orbitron", sans-serif;
				font-weight: bold;
				margin-bottom: 55px;
				font-size: 50px;
				}
				.form-group label {
				font-weight: bold;
				color: #55656d;
				}
				.btn-custom {
				background-color: #e46c04;
				color: white;
				font-weight: bold;
				border-radius: 5px;
				padding: 10px 20px;
				transition: background-color 0.3s;
				}
				.btn-custom:hover {
				background-color: #e46c04;
				}
				.btn-add {
				background-color: #184064;
				color: white;
				font-weight: bold;
				border-radius: 5px;
				padding: 5px 10px;
				margin-top: 10px;
				transition: background-color 0.3s;
				}
				.btn-add:hover {
				background-color: #689ab5;
				}
				.step-container {
				display: none;
				}
				.step-active {
				display: block;
				}
				.action-bar {
				display: flex;
				justify-content: space-between;
				margin-bottom: 20px;
				position: relative;
				margin: 20px 0;
				padding: 0 20px;
				}
				#previewButton {
				background: #e46c04;
				border-color: #e46c04;
				}
				#previewButton:hover {
				background: #e46c04;
				border-color: #e46c04;
				}
				.action-bar::before {
				content: "";
				position: absolute;
				top: 50%;
				left: 0;
				width: 100%;
				height: 4px;
				background: #f2f2f2;
				transform: translateY(-50%);
				z-index: 0;
				}
				.action-bar .fill {
				content: "";
				position: absolute;
				top: 50%;
				left: 0;
				width: 0;
				height: 4px;
				background: #184064;
				transform: translateY(-50%);
				z-index: 1;
				transition: width 0.4s ease;
				}
				.step {
				z-index: 1;
				position: relative;
				width: 25%;
				text-align: center;
				}
				.step .circle {
				width: 30px;
				height: 30px;
				margin: 0 auto 10px;
				background: #55656d;
				border-radius: 50%;
				line-height: 30px;
				color: #f2f2f2;
				}
				.step.current .circle,
				.step.completed .circle {
				background: #e46c04;
				}
				.step.completed .circle {
				background: #184064;
				}
				.step.completed .label {
				color: #184064;
				}
				.step .label {
				font-size: 14px;
				color: #55656d;
				}
				.step.current .label {
				font-weight: bold;
				color: #e46c04;
				}
				/* color dropdown */
				.custom-select-wrapper {
				position: relative;
				display: inline-block;
				width: 100%;
				}
				.custom-select {
				display: flex;
				flex-direction: column;
				width: 100%;
				}
				.custom-select-trigger {
				display: flex;
				align-items: center;
				justify-content: space-between;
				background-color: #fff;
				border: 1px solid #ccc;
				padding: 10px;
				border-radius: 4px;
				cursor: pointer;
				}
				.custom-options {
				position: absolute;
				display: none;
				flex-wrap: wrap;
				width: 100%;
				background-color: #fff;
				border: 1px solid #ccc;
				border-radius: 4px;
				z-index: 10;
				margin-top: 5px;
				padding: 10px;
				box-sizing: border-box;
				column-count: 3;
				column-gap: 10px;
				}
				.custom-option {
				width: calc(33.33% - 10px);
				height: 40px;
				margin-bottom: 5px;
				cursor: pointer;
				border-radius: 4px;
				}
				.custom-option:hover {
				opacity: 0.8;
				}
				.custom-select-trigger .arrow {
				width: 0;
				height: 0;
				border-left: 6px solid transparent;
				border-right: 6px solid transparent;
				border-top: 6px solid #555;
				margin-right: 5px;
				}
				.custom-select-trigger #selectedColor {
				flex-grow: 1;
				text-align: center;
				}
				.custom-select-trigger .color-box {
				width: 20px;
				height: 20px;
				display: inline-block;
				margin-right: 10px;
				vertical-align: middle;
				border-radius: 4px;
				}
				.noCodeMessage {
				display: block;
				background-color: white;
				border: 1px solid #ccc;
				padding: 30px;
				margin-top: 10px;
				margin-left: 20px;
				margin-right: 20px;
				font-size: 17px;
				color: black;
				}
				.codeDescMessage {
				display: block;
				font-weight: lighter;
				margin-top: 40px;
				margin-left: 0px;
				margin-right: 285px;
				margin-bottom: 10px;
				font-size: 17px;
				color: black;
				}
				.codeTitle {
				font-weight: bolder;
				}
				.required:after {
				content: " *";
				color: red;
				}
				.form-control {
				width: 100%;
				}
				.form-check-input {
				margin-right: 5px;
				}
				.form-check-label {
				margin-left: 5px;
				}
				.selected-description {
				border: 2px solid blue !important;
				/* force blue border for selected description */
				}
				.dropdown-menu {
				height: auto;
				max-height: 200px;
				overflow-x: hidden;
				width: 300px;
				}
				.btn-primary {
				background-color: #e46c04;
				border-color: #e46c04;
				}
				.btn-primary:hover {
				background-color: #8a4204;
				border-color: #8a4204;
				}
				.btn-add {
				background-color: #184064;
				border-color: #184064;
				}
				body {
				background-color:#F2F2F2;
				font-family: 'Jost', sans-serif;
				}
			</style>
		</head>
		<body>
			<div class="container my-5">
				<section class="page-title-section text-center">

					<div class="container">
						<!-- Main title and subtitle -->

						<h2 class="subtitle"></h2>
					</div>
				</section>
				<div class="card">
					<div class="form">
						<form method="post" action="/generate_pdf" enctype="multipart/form-data">
							<div class="col-md-6">
								<div class="form-group">
									<label class="required" for="companyName" style="font-size: 1.2rem;"

										id="companyName"
										name="companyName"

										/>

							</div>
							<br>
							<div class="col-md-6">

									<br />

										type="file"
										class="form-control-file"
										id="logo"
										name="logo"
										onchange="checkFile(event)"
										accept="image/*"

							</div>
							<br>
							<div class="col-md-6">
								<div class="form-group">
									<label for="companyPictures" style="font-size: 1.2rem;"><strong>Company Picture</strong></label>
									<div id="picturesContainer">
										<row class="row mb-1 picture-upload">
											<div class="col-md-6 picture-upload mt-4">
												<input
													type="file"
													class="form-control-file"
													id="companyPictures"
													name="companyPictures[]"
													onchange="checkFile(event)"
													accept="image/*"
													/>
											</div>
										</row>
									</div>
								</div>
							</div>
							<br>
							<div class="col-md-6">
								<div class="form-group">
									<label for="logo" style="font-size: 1.2rem;">Capability Statement</label>
									<br />
									<br />
									<input
										type="file"
										class="form-control-file"
										id="logo"
										name="logo"
										onchange="checkStatementFile(event)"
										accept=".pdf"
										/>
								</div>
							</div>
							<div class="form-group mb-3 mt-5">
								<h4 class="required" style="font-size: 1.2rem; font-family: 'Jost', sans-serif;"><strong>Description</strong></h4>

									   >Enter your company description or a brief overview of
									your company.</strong
									   >
									<br />
									Describe what you do, what products or services you offer, and/or what makes your products or services special.
									</label>

									<textarea
										class="form-control mt-2"
										id="companyDescription"

						<button type="submit" class="btn btn-custom w-100 mt-3" style="

			<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
			<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
			<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
			<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
			<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
			<script src="{{ url_for('static', filename='images/competenciesDictionary.js') }}"></script>
			<script>
				
				// Function to show the PDF preview
				function showPreview() {
				  // Collect form data
				  const formData = new FormData(document.querySelector("form"));
				
				  // Send the form data to the server to generate the preview PDF
				  fetch("/generate_pdf_preview", {
				    method: "POST",
				    body: formData,
				  })
				    .then((response) => response.blob())
				    .then((blob) => {
				      // Create a URL for the blob and set it as the src of the iframe
				      const url = URL.createObjectURL(blob);
				      document.getElementById("pdfPreviewIframe").src = url;
				
				      // Show the modal
				      $("#pdfPreviewModal").modal("show");
				    })
				    .catch((error) => {
				      console.error("Error generating PDF preview:", error);
				    });
				}
				
				// Initialize tooltips using jQuery
				$(function () {
				  $('[data-toggle="tooltip"]').tooltip();
				});
				
				//for the logo upload
				function checkFile(event) {
				  const fileInput = event.target;
				  const filePath = fileInput.value;
				  const allowedExtensions = /(\.jpg|\.jpeg|\.png|\.gif)$/i;
				  if (!allowedExtensions.exec(filePath)) {
				    alert(
				      "Invalid file type. Please upload an image file (jpg, jpeg, png, gif).",
				    );
				    fileInput.value = "";
				    return false;
				  }
				  return true;
				}

				//for the pdf upload
				function checkStatementFile(event) {
					const fileInput = event.target;
					const filePath = fileInput.value;
					const allowedExtensions = /(\.pdf)$/i;
					if (!allowedExtensions.exec(filePath)) {
					  alert(
						"Invalid file type. Please upload an image file (jpg, jpeg, png, gif).",
					  );
					  fileInput.value = "";
					  return false;
					}
					return true;
				  }
				
				//color selection
				document.addEventListener("DOMContentLoaded", function () {
				  const trigger = document.getElementById("customSelectTrigger");
				  const options = document.getElementById("customOptions");
				  const selectedColor = document.getElementById("selectedColor");
				  const logoColorInput = document.getElementById("logoColor");
				  const customOptions = document.querySelectorAll(".custom-option");
				
				  trigger.addEventListener("click", function () {
				    options.style.display =
				      options.style.display === "flex" ? "none" : "flex";
				  });
				
				  customOptions.forEach((option) => {
				    option.addEventListener("click", function () {
				      const colorValue = option.getAttribute("data-value");
				      const colorStyle = option.style.backgroundColor;
				      selectedColor.textContent =
				        colorValue.charAt(0).toUpperCase() + colorValue.slice(1);
				      selectedColor.style.backgroundColor = colorStyle;
				      selectedColor.style.color =
				        colorValue === "white" ? "black" : "white";
				      logoColorInput.value = colorValue;
				      options.style.display = "none";
				    });
				  });
				
				  document.addEventListener("click", function (e) {
				    if (!trigger.contains(e.target) && !options.contains(e.target)) {
				      options.style.display = "none";
				    }
				  });
				});
				
				// Company description functionality
				function toggleCompanyDescriptionFields(hasDescription) {
				  const companyDescriptionFields = document.getElementById(
				    "companyDescriptionFields",
				  );
				  const additionalQuestions = document.getElementById(
				    "additionalQuestions",
				  );
				
				  if (hasDescription) {
				    companyDescriptionFields.style.display = "block";
				    additionalQuestions.style.display = "none";
				  } else {
				    companyDescriptionFields.style.display = "none";
				    additionalQuestions.style.display = "block";
				  }
				}
				
				function generateDescription() {
				  const companyDescription =
				    document.getElementById("companyDescription").value;
				  const companyName = document.getElementById("companyName").value;
				
				  fetch("/generate_description", {
				    method: "POST",
				    headers: {
				      "Content-Type": "application/json",
				    },
				    body: JSON.stringify({
				      companyDescription: companyDescription,
				      companyName: companyName,
				    }),
				  })
				    .then((response) => response.json())
				    .then((data) => {
				      if (data.description) {
				        document.getElementById(
				          "revisedDescriptionContainer",
				        ).style.display = "block";
				        document.getElementById("revisedDescription").value =
				          data.description;
				        document.getElementById("companyDescription").name = ""; // Clear the name to avoid duplication
				        document.getElementById("revisedDescription").name =
				          "companyDescription"; // Set the name for the revised description
				      } else {
				        console.error("Error: Description not generated");
				      }
				    })
				    .catch((error) => {
				      console.error("Error:", error);
				    });
				}
				
				// Function to collect data ensuring correct description is used
				function collectData() {
				  let finalDescription = document
				    .getElementById("revisedDescription")
				    .value.trim();
				  const originalDescription = document
				    .getElementById("companyDescription")
				    .value.trim();
				
				  // If the revised description is empty, use the original company description
				  if (!finalDescription) {
				    finalDescription = originalDescription;
				  }
				
				  const companyName = document.getElementById("companyName").value;
				
				  return {
				    companyDescription: finalDescription,
				    companyName: companyName,
				  };
				}
				
				// Function to handle the form submission or data processing
				function processData() {
				  const data = collectData();
				
				  fetch("/your_existing_endpoint", {
				    method: "POST",
				    headers: {
				      "Content-Type": "application/json",
				    },
				    body: JSON.stringify(data),
				  })
				    .then((response) => response.json())
				    .then((result) => {
				      console.log("Data processed successfully:", result);
				    })
				    .catch((error) => {
				      console.error("Error processing data:", error);
				    });
				}
				
				// Toggle UEI Code functionality
				function toggleUEICodeInput(hasUEICode) {
				  var ueiCodeInput = document.getElementById("ueiCode");
				  var ueiCodeMessage = document.getElementById("ueiCodeMessage");
				
				  if (hasUEICode) {
				    ueiCodeInput.style.display = "block";
				    ueiCodeMessage.style.display = "none";
				  } else {
				    ueiCodeInput.style.display = "none";
				    ueiCodeMessage.style.display = "block";
				  }
				}
				
				// Toggle CAGE Code functionality
				function toggleCAGECodeInput(hasCAGECode) {
				  var cageCodeInput = document.getElementById("cageCode");
				  var cageCodeMessage = document.getElementById("cageCodeMessage");
				
				  if (hasCAGECode) {
				    cageCodeInput.style.display = "block";
				    cageCodeMessage.style.display = "none";
				  } else {
				    cageCodeInput.style.display = "none";
				    cageCodeMessage.style.display = "block";
				  }
				}
				
				// Toggle NAICS Codes functionality
				function toggleNAICSCodesInput(hasNAICSCodes) {
				  var naicsCodesInputs = document.getElementById("naicsCodesInputs");
				  var naicsCodesMessage = document.getElementById("naicsCodesMessage");
				
				  if (hasNAICSCodes) {
				    naicsCodesInputs.style.display = "block";
				    naicsCodesMessage.style.display = "none";
				  } else {
				    naicsCodesInputs.style.display = "block";
				    naicsCodesMessage.style.display = "block";
				  }
				}
				
				// Adding NAICS codes
				function addNaicsCode() {
				  var naicsCodesInputs = document.getElementById("naicsCodesInputs");
				  var newInputGroup = document.createElement("div");
				  newInputGroup.className = "mb-2 mt-2 naics-code-block";
				  newInputGroup.innerHTML = `
				<input type="text" class="form-control me-2" name="naicsCode[]" placeholder="Code" required>
				<input type="text" class="form-control" name="naicsDescription[]" placeholder="Description" required>
				<button type="button" class="btn btn-danger btn-sm" onclick="removeNaicsCode(this)">Remove</button>
				`;
				  naicsCodesInputs.insertBefore(
				    newInputGroup,
				    naicsCodesInputs.lastElementChild,
				  );
				}
				
				// Removing NAICS codes
				function removeNaicsCode(button) {
				  var naicsCodeBlock = button.parentElement;
				  naicsCodeBlock.remove();
				}
				
				//'what makes you different' section
				document.addEventListener("DOMContentLoaded", function () {
				  // Initialize tooltips
				  $('[data-toggle="tooltip"]').tooltip();
				});
				
				//Generated differentiators
				async function generateBulletPoints() {
				  const ideas = document.getElementById("ideasInput").value;
				  if (!ideas.trim()) {
				    alert("Please enter some ideas.");
				    return;
				  }
				
				  try {
				    const response = await fetch("/generate_bullet_points", {
				      method: "POST",
				      headers: {
				        "Content-Type": "application/json",
				      },
				      body: JSON.stringify({ ideas }),
				    });
				
				    if (response.ok) {
				      const data = await response.json();
				      console.log("Generated bullet points:", data);
				      const uniquePointsList =
				        document.getElementById("uniquePointsList");
				      uniquePointsList.innerHTML = ""; // Clear existing points
				      data.bulletPoints.forEach((point) => {
				        const newPoint = document.createElement("li");
				        newPoint.className = "d-flex align-items-center mt-2";
				        newPoint.innerHTML = `
				        <input type="text" class="form-control me-2" name="uniquePoints[]" value="${point}" placeholder="Enter a differentiator (max 100 characters)" maxlength="100">
				        <button type="button" class="btn btn-danger btn-sm" onclick="removeUniquePoint(this)">Remove</button>
				    `;
				        uniquePointsList.appendChild(newPoint);
				      });
				      bulletPointsGenerated = true; // Set flag to true
				    } else {
				      console.error(
				        "Failed to generate bullet points:",
				        response.statusText,
				      );
				      alert("Failed to generate bullet points. Please try again.");
				    }
				  } catch (error) {
				    console.error("Error generating bullet points:", error);
				    alert("An error occurred. Please try again.");
				  }
				}
				
				function removeUniquePoint(button) {
				  const point = button.parentNode;
				  point.parentNode.removeChild(point);
				}
				
				// Function to populate Industry dropdown
				function populateIndustryDropdown() {
				  const dropdownMenu = document.querySelector(".dropdown-menu");
				  const industries = Object.keys(competencies).sort();
				
				  industries.forEach((industry) => {
				    const listItem = document.createElement("li");
				    const link = document.createElement("a");
				    link.classList.add("dropdown-item");
				    link.href = "#";
				    link.textContent = industry;
				    link.onclick = () => selectIndustry(industry);
				    listItem.appendChild(link);
				    dropdownMenu.appendChild(listItem);
				  });
				}
				
				document.addEventListener("DOMContentLoaded", function () {
				  const dropdownInput = document.querySelector(".dropdown-menu input");
				  dropdownInput.addEventListener("input", handleInput);
				  dropdownInput.addEventListener("keydown", checkEnter);
				
				  // Initially populate the dropdown
				  populateIndustryDropdown();
				});
				
				function handleInput(event) {
				  const inputValue = event.target.value.toLowerCase();
				  const dropdownMenu = document.querySelector(".dropdown-menu");
				
				  // Remove all items except the input field
				  const listItems = dropdownMenu.querySelectorAll("li");
				  listItems.forEach((item) => {
				    if (!item.querySelector("input")) {
				      item.remove();
				    }
				  });
				
				  // Filter industries based on input value
				  const filteredIndustries = Object.keys(competencies).filter(
				    (industry) => industry.toLowerCase().includes(inputValue),
				  );
				
				  // Add filtered industries to the dropdown
				  filteredIndustries.forEach((industry) => {
				    const listItem = document.createElement("li");
				    const link = document.createElement("a");
				    link.classList.add("dropdown-item");
				    link.href = "#";
				    link.textContent = industry;
				    link.onclick = () => selectIndustry(industry);
				    listItem.appendChild(link);
				    dropdownMenu.appendChild(listItem);
				  });
				
				  // If input is empty, repopulate with all industries
				  if (inputValue === "") {
				    populateIndustryDropdown();
				  }
				}
				
				function checkEnter(event) {
				  if (event.key === "Enter") {
				    const inputValue = event.target.value.trim();
				    if (inputValue) {
				      selectIndustry(inputValue);
				      event.target.value = ""; // Clear the input
				      handleInput({ target: event.target }); // Refresh the dropdown
				    }
				    event.preventDefault(); // Prevent form submission or default action
				  }
				}
				
				function selectIndustry(industry) {
				  const selectedIndustries =
				    document.getElementById("selectedIndustries");
				
				  // Check if the industry is already selected
				  const existingIndustries = Array.from(
				    selectedIndustries.children,
				  ).map((span) => span.textContent);
				  if (
				    existingIndustries.includes(industry) ||
				    existingIndustries.length >= 3
				  )
				    return;
				
				  const industrySpan = document.createElement("span");
				  industrySpan.className = "badge bg-secondary me-2";
				  industrySpan.textContent = industry;
				  industrySpan.onclick = () => {
				    industrySpan.remove();
				    showCompetencies(getSelectedIndustries());
				  };
				  selectedIndustries.appendChild(industrySpan);
				
				  showCompetencies(getSelectedIndustries());
				  validateIndustrySelection();
				}
				
				function validateIndustrySelection() {
				  const selectedIndustries =
				    document.getElementById("selectedIndustries");
				  const error = document.getElementById("industryError");
				
				  if (selectedIndustries.children.length === 0) {
				    if (!error) {
				      const errorMessage = document.createElement("div");
				      errorMessage.id = "industryError";
				      errorMessage.className = "text-danger mt-2";
				      errorMessage.textContent = "Please select at least one industry.";
				      selectedIndustries.parentElement.appendChild(errorMessage);
				    }
				  } else {
				    if (error) {
				      error.remove();
				    }
				  }
				}
				
				function getSelectedIndustries() {
				  return Array.from(
				    document.getElementById("selectedIndustries").children,
				  ).map((span) => span.textContent);
				}
				
				function validateCompetencySelection() {
				  const checkboxes = document.querySelectorAll(
				    "#competenciesChecklist .form-check-input",
				  );
				  const checkedCount = Array.from(checkboxes).filter(
				    (checkbox) => checkbox.checked,
				  ).length;
				  const error = document.getElementById("competencyError");
				
				  checkboxes.forEach((checkbox) => {
				    if (checkedCount >= 5) {
				      // Disable unchecked checkboxes if 5 competencies are selected
				      if (!checkbox.checked) {
				        checkbox.disabled = true;
				      }
				    } else {
				      // Enable all checkboxes if less than 5 competencies are selected
				      checkbox.disabled = false;
				    }
				  });
				
				  if (checkedCount < 3) {
				    if (!error) {
				      const errorMessage = document.createElement("div");
				      errorMessage.id = "competencyError";
				      errorMessage.className = "text-danger mt-2";
				      errorMessage.textContent =
				        "Please select at least 3 core competencies.";
				      document
				        .getElementById("competenciesChecklist")
				        .appendChild(errorMessage);
				    }
				  } else {
				    if (error) {
				      error.remove();
				    }
				  }
				}
				
				// Add event listener to checkboxes
				function addCheckboxListeners() {
				  const checkboxes = document.querySelectorAll(
				    "#competenciesChecklist .form-check-input",
				  );
				  checkboxes.forEach((checkbox) => {
				    checkbox.addEventListener("change", validateCompetencySelection);
				  });
				}
				
				function showCompetencies(selectedIndustries) {
				  const competenciesChecklist = document.getElementById(
				    "competenciesChecklist",
				  );
				  const coreCompetenciesSection = document.getElementById(
				    "coreCompetenciesSection",
				  );
				  const addCompetencyButton = document.getElementById(
				    "addCompetencyButton",
				  );
				
				  // Clear previous competencies
				  competenciesChecklist.innerHTML = "";
				
				  if (selectedIndustries.length > 0) {
				    coreCompetenciesSection.style.display = "block";
				
				    const addedCompetencies = new Set(); // To track added competencies
				
				    selectedIndustries.forEach((industry) => {
				      if (competencies[industry]) {
				        const industryCompetencies = competencies[industry];
				        industryCompetencies.forEach((comp) => {
				          if (!addedCompetencies.has(comp)) {
				            addedCompetencies.add(comp); // Add competency to the set
				            const competencyItem = document.createElement("div");
				            competencyItem.className = "form-check";
				            competencyItem.innerHTML = `
				                <input class="form-check-input" type="checkbox" value="${comp}" name="coreCompetencies[]" id="competency${comp}" onchange="validateCompetencySelection()">
				                <label class="form-check-label" for="competency${comp}">${comp}</label>
				            `;
				            competenciesChecklist.appendChild(competencyItem);
				          }
				        });
				      }
				    });
				
				    addCompetencyButton.style.display = "block";
				    addCheckboxListeners();
				  } else {
				    coreCompetenciesSection.style.display = "none";
				    addCompetencyButton.style.display = "none";
				  }
				
				  validateCompetencySelection();
				}
				
				// Function to add custom competency
				function addCustomCompetency() {
				  const competenciesChecklist = document.getElementById(
				    "competenciesChecklist",
				  );
				  const customCompetencyItem = document.createElement("div");
				  customCompetencyItem.className =
				    "form-check d-flex align-items-center mb-2";
				  customCompetencyItem.innerHTML = `
				        <input class="form-check-input" type="checkbox" value="Custom" id="competencyCustom" checked>
				        <label class="form-check-label flex-grow-1" for="competencyCustom">
				            <input type="text" class="form-control" name="coreCompetencies[]" placeholder="Enter competency">
				        </label>
				        <button type="button" class="btn btn-danger btn-sm ms-2" onclick="removeCompetency(this)">X</button>
				    `;
				  competenciesChecklist.appendChild(customCompetencyItem);
				}
				
				// Function to remove custom competency
				function removeCompetency(button) {
				  const competencyItem = button.closest(".form-check");
				  competencyItem.remove();
				}
				
				// Call the function to populate the dropdown on page load
				document.addEventListener("DOMContentLoaded", populateIndustryDropdown);
				
				//key differentiators section
				function addKeyDifferentiator() {
				  const container = document.getElementById(
				    "keyDifferentiatorsContainer",
				  );
				  const newInputGroup = document.createElement("div");
				  newInputGroup.className = "input-group mb-3";
				  newInputGroup.innerHTML = `
				        <input type="text" class="form-control" name="keyDifferentiators[]" required>
				            <button class="btn btn-outline-secondary" type="button" onclick="addKeyDifferentiator()">Add+</button>
				            `;
				  container.appendChild(newInputGroup);
				}
				
				//adding more social media links
				function addSocialMedia() {
				  const container = document.getElementById("socialMediaContainer");
				  const newInputGroup = document.createElement("div");
				  newInputGroup.className = "input-group mb-3";
				  newInputGroup.innerHTML = `
				                <input type="url" class="form-control" name="socialMedia[]" placeholder="Enter social media URL" >
				                    <button class="btn btn-outline-secondary" type="button" onclick="addSocialMedia()">Add+</button>
				                    `;
				  container.appendChild(newInputGroup);
				}
				
				//toggle for performance section
				function togglePerformanceSections() {
				  const privateContainer = document.getElementById(
				    "privatePerformanceContainer",
				  );
				  const publicContainer = document.getElementById(
				    "publicPerformanceContainer",
				  );
				
				  const privateRadio = document.getElementById(
				    "privatePerformanceRadio",
				  );
				  const publicRadio = document.getElementById("publicPerformanceRadio");
				  const bothRadio = document.getElementById("bothPerformanceRadio");
				
				  if (privateRadio.checked) {
				    privateContainer.style.display = "block";
				    publicContainer.style.display = "none";
				  } else if (publicRadio.checked) {
				    privateContainer.style.display = "none";
				    publicContainer.style.display = "block";
				  } else if (bothRadio.checked) {
				    privateContainer.style.display = "block";
				    publicContainer.style.display = "block";
				  } else {
				    privateContainer.style.display = "none";
				    publicContainer.style.display = "none";
				  }
				}
				
				// Adding private performance
				function addPrivatePerformance() {
				  const privateContainer = document.getElementById(
				    "privatePerformanceList",
				  );
				  const newPrivatePerformance = document.createElement("li");
				  newPrivatePerformance.className = "align-items-center mt-2";
				  newPrivatePerformance.innerHTML = `
				         <div class="private-performance mb-3">
				                                
				                                <input type="text" class="form-control mb-2" name="privateCompanyName[]"
				                                    placeholder="Company Name">
				                                <textarea class="form-control mb-2 " name="privateDescription[]"
				                                    placeholder="Please provide brief details for each relevant project including project title, a concise description, and specific performance metrics (max 100 characters)"
				                                    rows="3" maxlength="100"></textarea>
				                                <button type="button" class="btn btn-danger btn-sm"
				                                    onclick="removePrivatePerformance(this)">Remove</button>
				                            </div>
				    `;
				  privateContainer.appendChild(newPrivatePerformance);
				}
				
				// Removing a private performance entry
				function removePrivatePerformance(button) {
				  const li = button.parentNode;
				  li.parentNode.removeChild(li);
				}
				
				//adding public performance
				function addPublicPerformance() {
				  const publicContainer = document.getElementById(
				    "public-performances-container",
				  );
				  const newPublicPerformance = document.createElement("div");
				  newPublicPerformance.className = "public-performance mt-3 mb-3";
				  newPublicPerformance.innerHTML = `                
				                            <label>Upload Agency Logo</label>
				                            <div><input type="file" class="form-control-file mb-2" name="publicLogo[]" accept="image/*">
				                                </div>
				                                <button type="button" class="btn btn-danger btn-sm"
				                                    onclick="removePublicPerformance(this)">Remove</button>`;
				  publicContainer.appendChild(newPublicPerformance);
				}
				
				// Removing a public performance entry
				function removePublicPerformance(button) {
				  const li = button.parentNode;
				  li.parentNode.removeChild(li);
				}
				function removeCertification(button) {
				  const li = button.parentNode;
				  li.parentNode.removeChild(li);
				}
				
				//more certs
				//Function to add a new certificate upload field
				function addNewCertification() {
				  const competenciesChecklist =
				    document.getElementById("certificationsList");
				  const customCompetencyItem = document.createElement("div");
				  customCompetencyItem.className =
				    "form-check d-flex align-items-center mb-2";
				  customCompetencyItem.innerHTML = `
				        <input class="form-check-input" type="checkbox" value="Custom" id="certificateCustom">
				                        <label class="form-check-label flex-grow-1" for="certificateCustom">
				                            <input type="text" class="form-control" name="certificateDescription[]" placeholder="Enter Certificate">
				                        </label>
				        <button type="button" class="btn btn-danger btn-sm ms-2" onclick="removeCompetency(this)">X</button>
				    `;
				  competenciesChecklist.appendChild(customCompetencyItem);
				}
				
				//show preview
				function showPreview() {
				  const formData = new FormData(document.querySelector("form"));
				
				  fetch("/generate_pdf_preview", {
				    method: "POST",
				    body: formData,
				  })
				    .then((response) => response.blob())
				    .then((blob) => {
				      const url = URL.createObjectURL(blob);
				      document.getElementById("pdfPreviewIframe").src = url;
				
				      // Show the modal
				      const pdfPreviewModal = new bootstrap.Modal(
				        document.getElementById("pdfPreviewModal"),
				        {
				          keyboard: false,
				        },
				      );
				      pdfPreviewModal.show();
				    })
				    .catch((error) => {
				      console.error("Error generating PDF preview:", error);
				    });
				}
				
				//validation
				function validateForm() {
				  const webInput = document.getElementById("web");
				  const webValue = webInput.value.trim();
				  const socialMediaInputs = document.getElementsByName("socialMedia[]");
				  const urlPattern = /^(https?:\/\/)?(www\.)?[a-z0-9-]+(\.[a-z]+)+.*$/i;
				
				  if (webValue && !urlPattern.test(webValue)) {
				    alert("Please enter a valid website link.");
				    return false;
				  }
				  return true;
				
				  for (let input of socialMediaInputs) {
				    const value = input.value.trim();
				    if (value && !urlPattern.test(value)) {
				      alert("Please enter a valid social media link.");
				      return false;
				    }
				  }
				  return true;
				}
				
				// Attach event listeners to "Next" button clicks
				document
				  .getElementById("nextButton")
				  .addEventListener("click", nextStep);
				
				function validateCurrentStep() {
				  const currentFields = document.querySelectorAll(
				    ".step-active input[required], .step-active textarea[required], .step-active select[required]",
				  );
				  for (let field of currentFields) {
				    if (!field.value.trim()) {
				      field.focus();
				      alert("Please fill out the required fields.");
				      return false;
				    }
				  }
				
				  // Additional validation for Step 4 (Differentiators)
				  if (currentStep === 4) {
				    if (!bulletPointsGenerated) {
				      alert("Please generate the differentiators bullet points before proceeding.");
				      return false;
				    }
				  }
				
				  // Additional validation for Step 5 (Industries and Competencies)
				  if (currentStep === 5) {
				    if (!validateStep5()) {
				      alert("Please complete all required fields in Step 5.");
				      return false;
				    }
				  }
				
				  return true;
				}
				
				function validateIndustrySelection() {
				  const selectedIndustries =
				    document.getElementById("selectedIndustries");
				  const error = document.getElementById("industryError");
				
				  if (
				    selectedIndustries.children.length === 0 ||
				    selectedIndustries.children.length > 3
				  ) {
				    if (!error) {
				      const errorMessage = document.createElement("div");
				      errorMessage.id = "industryError";
				      errorMessage.className = "text-danger mt-2";
				      errorMessage.textContent =
				        "Please select at least one industry and no more than three.";
				      selectedIndustries.parentElement.appendChild(errorMessage);
				    }
				  } else {
				    if (error) {
				      error.remove();
				    }
				  }
				}
				
				function validateCompetencySelection() {
				  const checkboxes = document.querySelectorAll(
				    "#competenciesChecklist .form-check-input",
				  );
				  const checkedCount = Array.from(checkboxes).filter(
				    (checkbox) => checkbox.checked,
				  ).length;
				  const error = document.getElementById("competencyError");
				
				  checkboxes.forEach((checkbox) => {
				    if (checkedCount >= 5) {
				      if (!checkbox.checked) {
				        checkbox.disabled = true;
				      }
				    } else {
				      checkbox.disabled = false;
				    }
				  });
				
				  if (checkedCount < 3) {
				    if (!error) {
				      const errorMessage = document.createElement("div");
				      errorMessage.id = "competencyError";
				      errorMessage.className = "text-danger mt-2";
				      errorMessage.textContent =
				        "Please select at least 3 core competencies.";
				      document
				        .getElementById("competenciesChecklist")
				        .appendChild(errorMessage);
				    }
				  } else {
				    if (error) {
				      error.remove();
				    }
				  }
				}
				
				function validateStep5() {
				  validateIndustrySelection();
				  validateCompetencySelection();
				
				  const industryError = document.getElementById("industryError");
				  const competencyError = document.getElementById("competencyError");
				
				  return !(industryError || competencyError);
				}
				
				async function generateBulletPoints() {
				  const ideas = document.getElementById("ideasInput").value;
				  if (!ideas.trim()) {
				    alert("Please enter some ideas.");
				    return;
				  }
				
				  try {
				    const response = await fetch("/generate_bullet_points", {
				      method: "POST",
				      headers: {
				        "Content-Type": "application/json",
				      },
				      body: JSON.stringify({ ideas }),
				    });
				
				    if (response.ok) {
				      const data = await response.json();
				      console.log("Generated bullet points:", data);
				      const uniquePointsList =
				        document.getElementById("uniquePointsList");
				      uniquePointsList.innerHTML = ""; // Clear existing points
				      data.bulletPoints.forEach((point) => {
				        const newPoint = document.createElement("li");
				        newPoint.className = "d-flex align-items-center mt-2";
				        newPoint.innerHTML = `
				                    <input type="text" class="form-control me-2" name="uniquePoints[]" value="${point}" placeholder="Enter a differentiator (max 100 characters)" maxlength="100">
				                    <button type="button" class="btn btn-danger btn-sm" onclick="removeUniquePoint(this)">Remove</button>
				                `;
				        uniquePointsList.appendChild(newPoint);
				      });
				
				      // Set the bulletPointsGenerated to true when the button is clicked
				      bulletPointsGenerated = true;
				    } else {
				      console.error(
				        "Failed to generate bullet points:",
				        response.statusText,
				      );
				      alert("Failed to generate bullet points. Please try again.");
				    }
				  } catch (error) {
				    console.error("Error generating bullet points:", error);
				    alert("An error occurred. Please try again.");
				  }
				}
				
				function removeUniquePoint(button) {
				  const point = button.parentNode;
				  point.parentNode.removeChild(point);
				}
				
				function nextStep() {
				  if (validateCurrentStep()) {
				    if (currentStep < 8) {
				      visitedSteps.add(currentStep);
				      currentStep++;
				      showStep(currentStep);
				    }
				  }
				}
				
				function togglePastPerformance(show) {
				  document.getElementById("pastPerformanceDetails").style.display = show
				    ? "block"
				    : "none";
				}
				
				function togglePerformanceSections() {
				  const privateContainer = document.getElementById(
				    "privatePerformanceContainer",
				  );
				  const publicContainer = document.getElementById(
				    "publicPerformanceContainer",
				  );
				
				  const privateRadio = document.getElementById(
				    "privatePerformanceRadio",
				  ).checked;
				  const publicRadio = document.getElementById(
				    "publicPerformanceRadio",
				  ).checked;
				  const bothRadio = document.getElementById(
				    "bothPerformanceRadio",
				  ).checked;
				
				  privateContainer.style.display =
				    privateRadio || bothRadio ? "block" : "none";
				  publicContainer.style.display =
				    publicRadio || bothRadio ? "block" : "none";
				}
				
				function toggleCertifications(show) {
				  document.getElementById("certificationsContainer").style.display =
				    show ? "block" : "none";
				}
			</script>
