{% include 'head.html' %}
<body>
    {% include 'navbar.html' %}
    <style>
        .grecaptcha-badge {
            visibility: visible !important;
            opacity: 1 !important;
        }
        
        /* Light Theme for Signup Page */
        body {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%) !important;
            color: #2c3e50 !important;
            min-height: 100vh;
        }
        
        .signup-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            padding: 50px 40px;
            margin-top: 120px;
            margin-bottom: 60px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .login-signup-title {
            color: #446dcd !important;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 2.2rem;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .form-section {
            margin-bottom: 30px;
        }
        
        .form-section-title {
            color: #2c3e50;
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 20px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e9ecef;
        }
        
        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .form-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-control {
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 16px 20px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #f8f9fa;
            height: auto;
        }
        
        .form-control:focus {
            border-color: #446dcd;
            box-shadow: 0 0 0 0.2rem rgba(68, 109, 205, 0.15);
            background: white;
            outline: none;
        }
        
        .form-control::placeholder {
            color: #6c757d;
            font-weight: 400;
        }
        
        .form-select {
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 16px 20px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #f8f9fa;
            height: auto;
        }
        
        .form-select:focus {
            border-color: #446dcd;
            box-shadow: 0 0 0 0.2rem rgba(68, 109, 205, 0.15);
            background: white;
            outline: none;
        }
        
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #6c757d;
            transition: color 0.3s ease;
            z-index: 10;
        }
        
        .password-toggle:hover {
            color: #446dcd;
        }
        
        .billing-section {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 25px;
            border-radius: 15px;
            border: 2px solid #e9ecef;
            margin: 25px 0;
        }
        
        .billing-title {
            color: #2c3e50;
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .billing-option {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .billing-option:hover {
            border-color: #446dcd;
            box-shadow: 0 4px 12px rgba(68, 109, 205, 0.1);
        }
        
        .billing-option.selected {
            border-color: #446dcd;
            background: linear-gradient(135deg, rgba(68, 109, 205, 0.05) 0%, rgba(75, 182, 211, 0.05) 100%);
        }
        
        .billing-radio {
            width: 20px;
            height: 20px;
            margin-right: 15px;
            accent-color: #446dcd;
        }
        
        .billing-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            margin: 0;
        }
        
        .billing-text {
            color: #2c3e50;
            font-size: 1rem;
            font-weight: 500;
        }
        
        .billing-price {
            font-weight: 700;
            color: #27AE60;
            font-size: 1.1rem;
        }
        
        .btn-signup {
            background: linear-gradient(135deg, #446dcd 0%, #4bb6d3 100%);
            border: none;
            padding: 18px 30px;
            font-weight: 700;
            border-radius: 12px;
            transition: all 0.3s ease;
            color: white;
            font-size: 1.2rem;
            width: 100%;
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .btn-signup:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(68, 109, 205, 0.3);
            color: white;
        }
        
        .btn-signup:active {
            transform: translateY(0);
        }
        
        .alert-danger {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 25px;
            font-weight: 500;
        }
        
        .signup-links {
            text-align: center;
            margin-top: 30px;
        }
        
        .signup-links p {
            margin-bottom: 0;
            color: #6c757d;
        }
        
        .signup-links a {
            color: #446dcd;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }
        
        .signup-links a:hover {
            color: #4bb6d3;
            text-decoration: none;
        }
        
        .trial-badge {
            background: linear-gradient(135deg, #27AE60 0%, #2ECC71 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 20px;
        }
        
        /* Loading state */
        .btn-signup:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        
        /* Responsive design */
        @media (max-width: 768px) {
            .signup-container {
                margin: 80px 20px 40px;
                padding: 40px 25px;
            }
            
            .form-row {
                flex-direction: column;
                gap: 0;
            }
            
            .form-row .form-group {
                margin-bottom: 20px;
            }
            
            .login-signup-title {
                font-size: 1.8rem;
            }
        }
        
        @media (max-width: 576px) {
            .billing-section {
                padding: 20px 15px;
            }
            
            .billing-option {
                padding: 15px;
            }
        }
    </style>
        

    <div class="container">
        <div class="signup-container">
            <div class="trial-badge">
                <i class="fas fa-gift me-2"></i>Start Free Trial
            </div>
            
            <h1 class="login-signup-title">Create Your Account</h1>
            
            {% if error %}
                <div class="alert alert-danger" role="alert">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    <strong>Error:</strong> {{ error }}
                </div>
            {% endif %}
            
            <form method="POST" id="signup-form" action="{{ url_for('Signup') }}">
                <!-- Personal Information Section -->
                <div class="form-section">
                    <div class="form-section-title">
                        <i class="fas fa-user me-2"></i>Personal Information
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <input type="text" 
                                   class="form-control" 
                                   name="first_name" 
                                   placeholder="First Name" 
                                   required 
                                   autofocus
                                   autocomplete="given-name">
                        </div>
                        <div class="form-group">
                            <input type="text" 
                                   class="form-control" 
                                   name="last_name" 
                                   placeholder="Last Name" 
                                   required
                                   autocomplete="family-name">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <input type="text" 
                               class="form-control" 
                               name="company" 
                               placeholder="Company Name" 
                               required
                               autocomplete="organization">
                    </div>
                </div>

                <!-- Account Details Section -->
                <div class="form-section">
                    <div class="form-section-title">
                        <i class="fas fa-key me-2"></i>Account Details
                    </div>
                    
                    <div class="form-group">
                        <input type="email" 
                               class="form-control" 
                               name="email" 
                               placeholder="Email Address" 
                               required
                               autocomplete="email">
                    </div>
                    
                    <div class="form-group">
                        <input type="text" 
                               class="form-control" 
                               name="username" 
                               placeholder="Username" 
                               required
                               autocomplete="username">
                    </div>
                    
                    <div class="form-group position-relative">
                        <input type="password" 
                               class="form-control" 
                               name="password" 
                               id="signupPassword" 
                               placeholder="Create a strong password" 
                               required
                               autocomplete="new-password">
                        <span class="password-toggle" onclick="toggleSignupPasswordVisibility()">
                            <i id="signupTogglePasswordIcon" class="fas fa-eye"></i>
                        </span>
                    </div>
                </div>


                <!-- reCAPTCHA temporarily disabled for free access -->
                <input type="hidden" id="g-recaptcha-response" name="g-recaptcha-response" value="disabled">
                
                <button class="btn-signup" type="submit" id="signup-btn">
                    <span class="btn-text">Get Started Free</span>
                    <span class="btn-loading d-none">
                        <i class="fas fa-spinner fa-spin me-2"></i>Creating Account...
                    </span>
                </button>
            </form>
            
            <div class="signup-links">
                <p>Already have an account? <a href="/login">Sign in here</a></p>
            </div>
        </div>
    </div>

    


    {% include 'footer.html' %}
    {% include 'scripts.html' %}




   <!-- ✅ Load reCAPTCHA API -->
<script src="https://www.google.com/recaptcha/api.js?render={{ RECAPTCHA_SITE_KEY }}" async defer></script>


<script>
    document.addEventListener("DOMContentLoaded", function () {
        const form = document.getElementById("signup-form");
        const submitBtn = document.getElementById("signup-btn");
        const btnText = submitBtn?.querySelector(".btn-text");
        const btnLoading = submitBtn?.querySelector(".btn-loading");
    
        if (!form) {
            console.error("❌ Form with ID 'signup-form' not found.");
            return;
        }
    
        form.addEventListener("submit", function (event) {
            event.preventDefault(); // Stop default submission
            console.log("🛑 Prevented form submission to inject reCAPTCHA token.");
            
            // Show loading state
            if (submitBtn) {
                submitBtn.disabled = true;
                if (btnText) btnText.classList.add("d-none");
                if (btnLoading) btnLoading.classList.remove("d-none");
            }
    
            grecaptcha.ready(function () {
                grecaptcha.execute("{{ RECAPTCHA_SITE_KEY }}", { action: "signup" })
                    .then(function (token) {
                        console.log("✅ reCAPTCHA Token:", token);
    
                        const recaptchaInput = document.getElementById("g-recaptcha-response");
    
                        if (recaptchaInput) {
                            recaptchaInput.value = token;
                            console.log("✅ Token injected. Submitting form...");
                            form.submit();
                        } else {
                            console.error("❌ Missing #g-recaptcha-response input.");
                            // Reset button state on error
                            if (submitBtn) {
                                submitBtn.disabled = false;
                                if (btnText) btnText.classList.remove("d-none");
                                if (btnLoading) btnLoading.classList.add("d-none");
                            }
                        }
                    })
                    .catch(function (error) {
                        console.error("❌ reCAPTCHA execution failed:", error);
                        alert("reCAPTCHA validation failed. Please refresh and try again.");
                        // Reset button state on error
                        if (submitBtn) {
                            submitBtn.disabled = false;
                            if (btnText) btnText.classList.remove("d-none");
                            if (btnLoading) btnLoading.classList.add("d-none");
                        }
                    });
            });
        });
    });
    </script>
    



    

    

     









    <script>
        function toggleSignupPasswordVisibility() {
            const passwordInput = document.getElementById("signupPassword");
            const icon = document.getElementById("signupTogglePasswordIcon");
            
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                passwordInput.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }
        
        // Enhanced form submission with loading state
        document.addEventListener("DOMContentLoaded", function() {
            const form = document.getElementById("signup-form");
            const submitBtn = document.getElementById("signup-btn");
            const btnText = submitBtn.querySelector(".btn-text");
            const btnLoading = submitBtn.querySelector(".btn-loading");
            
            // Handle form submission loading state
            if (form && submitBtn) {
                form.addEventListener("submit", function() {
                    submitBtn.disabled = true;
                    btnText.classList.add("d-none");
                    btnLoading.classList.remove("d-none");
                });
            }
        });
    </script>
    
</body>
