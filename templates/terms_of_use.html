{% include 'head.html' %}
<body>
    {% include 'navbar.html' %}

    <br>

    <div class="container" style="padding: 20px;">
        <h2 style="color: #005d92; margin-bottom: 20px;">Terms of Use</h2>
        
        <p style="margin-bottom: 15px;">
            <a href="{{ url_for('static', filename='docs/TermsofUse.pdf') }}" 
               target="_blank" 
               rel="noopener" 
               class="btn btn-primary" 
               style="background-color: #005d92; border-color: #005d92; margin-right: 10px;">
                Download PDF
            </a>
            <span style="color: #666;">Click to download if the document does not display below.</span>
        </p>

        <div id="pdf-preview" class="pb-4">
            <object
                data="{{ url_for('static', filename='docs/TermsofUse.pdf') }}"
                type="application/pdf"
                width="100%"
                height="800px"
                style="border: 1px solid #ccc; border-radius: 4px;">
                <embed
                    src="{{ url_for('static', filename='docs/TermsofUse.pdf') }}"
                    type="application/pdf"
                    width="100%"
                    height="800px" />
                <p style="padding: 20px; text-align: center;">
                    Your browser does not support embedded PDFs.
                    Please <a href="{{ url_for('static', filename='docs/TermsofUse.pdf') }}" 
                              target="_blank" 
                              rel="noopener"
                              style="color: #005d92;">download the PDF</a> to view it.
                </p>
            </object>
        </div>
    </div>

    <br>

    {% include 'footer.html' %}
    {% include 'scripts.html' %}
</body>
