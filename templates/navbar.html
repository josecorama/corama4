<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Navbar Fix</title>

  <!-- Bootstrap CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
  />

  <!-- Custom CSS -->
  <style>
    .navbar-custom {
      background-color: #ffffff;
      padding: 10px 20px;
      box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1);
    }

    .navbar-brand img {
      max-height: 60px; /* Reduced for mobile */
      width: auto;
    }

    @media (min-width: 768px) {
      .navbar-brand img {
        max-height: 80px; /* Larger for desktop */
      }
    }

    .nav-link {
      color: #000000;
      margin-right: 10px;
      transition: color 0.3s ease;
      font-size: 1rem;
      padding: 0.5rem 1rem;
    }

    @media (max-width: 767px) {
      .nav-link {
        font-size: 1.1rem; /* Larger font for mobile touch targets */
        padding: 0.75rem 1rem;
      }
      
      .navbar-buttons {
        flex-direction: column;
        width: 100%;
        margin-top: 1rem;
      }
      
      .navbar-buttons .btn {
        width: 100%;
        margin: 0.5rem 0;
      }

      .ihcc-logo {
        max-height: 40px;
        margin: 1rem auto;
        display: block;
      }
    }

    .nav-link:hover {
      color: #F67F00;
    }

    .navbar-toggler {
      padding: 0.5rem;
      border: none;
    }

    .navbar-toggler:focus {
      outline: none;
    }

    .navbar-toggler-icon {
      background-image: url("data:image/svg+xml;charset=UTF8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='30' height='30' viewBox='0 0 30 30'%3E%3Cpath stroke='rgba%280, 0, 0, 0.5%29' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3E%3C/svg%3E");
    }

    .navBardropdown {
      position: relative;
      display: inline-block;
    }

    .navBardropdown-menu {
      display: none;
      position: absolute;
      background-color: white;
      box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2);
      z-index: 1;
      min-width: 160px;
      padding: 10px 0;
      border-radius: 5px;
    }

    @media (max-width: 767px) {
      .navBardropdown-menu {
        position: static;
        box-shadow: none;
        padding-left: 1rem;
      }
    }

    .navBardropdown-menu a {
      display: block;
      padding: 8px 16px;
      text-decoration: none;
      color: black;
      transition: background-color 0.2s ease;
    }

    .navBardropdown-menu a:hover {
      background-color: #f1f1f1;
    }

    .navBardropdown:hover .navBardropdown-menu {
      display: block;
    }

    @media (max-width: 767px) {
      .navBardropdown:hover .navBardropdown-menu {
        display: none;
      }
      
      .navBardropdown.active .navBardropdown-menu {
        display: block;
      }
    }

    .btn-custom {
      background-color: #F67F00;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 8px 16px;
      margin-left: 10px;
      transition: background-color 0.3s ease;
    }

    .btn-custom:hover {
      background-color: #cc5600;
    }

    .ihcc-logo {
      max-height: 50px;
      width: auto;
    }

    @media (min-width: 768px) {
      .ihcc-logo {
        margin-left: 1rem;
      }
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="/">
        <img src="{{ url_for('static', filename='images/CORAMALOGO.png') }}" alt="CORAMA" />
      </a>
      <button
        class="navbar-toggler"
        type="button"
        data-toggle="collapse"
        data-target="#navbarResponsive"
        aria-controls="navbarResponsive"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarResponsive">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item {{ 'active' if request.path == '/' else '' }}">
            <a class="nav-link" href="/">Home</a>
          </li>
          <li class="nav-item {{ 'active' if request.path == '/aboutus' else '' }}">
            <a class="nav-link" href="/aboutus">About Us</a>
          </li>
          <li class="nav-item {{ 'active' if request.path == '/team' else '' }}">
            <a class="nav-link" href="/team">Our Team</a>
          </li>
          <li class="nav-item {{ 'active' if request.path == '/blog' else '' }}">
            <a class="nav-link" href="/blog">Blog</a>
          </li>
          <li class="nav-item {{ 'active' if request.path == '/support' else '' }}">
            <div class="navBardropdown">
              <a class="nav-link" href="#" onclick="event.preventDefault(); this.parentElement.classList.toggle('active');">Support</a>
              <div class="navBardropdown-menu">
                <a href="/faq">FAQ</a>
                <a href="/contact">Contact</a>
                <a href="/terms_of_use">Terms and Conditions</a>
              </div>
            </div>
          </li>
        </ul>
        
        <a class="nav-link d-flex align-items-center" href="https://ihccbusiness.net/">
          <img 
            src="{{ url_for('static', filename='images/IHCC_logo_color_TM.png') }}" 
            alt="IHCC" 
            class="ihcc-logo"
          />
        </a>

        <div class="navbar-buttons d-flex">
          {% if is_logged_in %}
            <a href="/welcome" class="btn btn-custom">Welcome</a>
            <a href="/logout" class="btn btn-custom">Log Out</a>
          {% else %}
            <a href="/login" class="btn btn-custom">Log In</a>
            <a href="/signup" class="btn btn-custom">Sign Up</a>
          {% endif %}
        </div>
      </div>
    </div>
  </nav>

  <!-- Optional JavaScript -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.6.2/js/bootstrap.min.js"></script>
</body>
</html>
