<!-- loading-overlay_SMART_SEARCH.html -->
<div id="loadingOverlaySmartSearch" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.7); z-index: 9999;">
    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center;">
        <div style="width: 150px; height: 150px; margin: 0 auto; display: flex; align-items: center; justify-content: center;">
            <img id="loadingLogo" src="{{ url_for('static', filename='images/Logoypo.png') }}" alt="Contract Radar Maximizer Logo" style="width: 140px; height: 140px; object-fit: contain;">
        </div>
        <p id="loadingText" style="color: white; font-size: 1.5rem;">Redirecting...</p>
    </div>
</div>

<style>
    /* ===== LOADING OVERLAY STYLES ===== */
    
    /* Logo Animation */
    #loadingLogo {
        width: 140px;
        height: 140px;
        object-fit: contain;
        filter: drop-shadow(0 0 15px rgba(102, 126, 234, 0.4));
        animation: loadingPulseRotate 2s ease-in-out infinite;
    }

    @keyframes loadingPulseRotate {
        0% { 
            transform: rotate(0deg) scale(1);
            filter: drop-shadow(0 0 15px rgba(102, 126, 234, 0.4));
        }
        50% { 
            transform: rotate(180deg) scale(1.1);
            filter: drop-shadow(0 0 25px rgba(102, 126, 234, 0.8));
        }
        100% { 
            transform: rotate(360deg) scale(1);
            filter: drop-shadow(0 0 15px rgba(102, 126, 234, 0.4));
        }
    }

    /* Text Animation */
    #loadingText {
        font-family: 'Inter', sans-serif;
        font-size: 1.5rem;
        font-weight: 600;
        color: #ffffff !important;
        text-shadow: 0 0 20px rgba(102, 126, 234, 0.8);
        margin-top: 30px;
        animation: loadingTextPulse 1.5s ease-in-out infinite;
    }

    @keyframes loadingTextPulse {
        0%, 100% { 
            opacity: 1;
            transform: translateY(0px);
        }
        50% { 
            opacity: 0.7;
            transform: translateY(-5px);
        }
    }
</style>
