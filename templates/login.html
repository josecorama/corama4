<!-- login.html -->
{% include 'head.html' %}
<body>
    {% include 'navbar.html' %}

    <div class="text-center mb-4">
      <br>
      <!-- Añadimos el contenedor con las mismas clases de Bootstrap para ancho -->
      <div class="row">
          <div class="col-md-6 offset-md-3">
            <h1 class="login-signup-title">LOG IN</h1>
          </div>
      </div>
  </div>
  <br>

    <div class="container">
      <div class="row">
          <div class="col-md-6 offset-md-3">
              {% if error %}
                  <div class="alert alert-danger text-center" role="alert">
                      {{ error }}
                  </div>
              {% endif %}
              
              <form method="POST" action="{{ url_for('Login') }}" id="login-form">
                  <div class="form-group">
                      <input type="email" class="form-control" name="email" placeholder="Email" required autofocus>
                  </div>
                  <br>
                  <div class="form-group position-relative">
                      <input type="password" class="form-control" name="password" id="password" placeholder="Password" required>
                      <span class="position-absolute" style="right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer;" onclick="togglePasswordVisibility()">
                          <i id="togglePasswordIcon" class="fas fa-eye"></i>
                      </span>
                  </div>
                  <br>
                  
                  <input type="hidden" id="g-recaptcha-response" name="g-recaptcha-response">
                  
                  <button class="btn btn-lg btn-block custom-login-btn" type="submit">Log in</button>

                    <style>
                    .custom-login-btn {
                        background-color: #6899b4;
                        border-color: #5a8aa4;
                        color: white;
                    }
                    </style>

              </form>
  
              <div class="text-center mt-4">
                  <p>Don't have an account? <a href="/signup">Sign up</a></p>

                  <br>

                  <p><a href="{{ url_for('reset_password') }}">Forgot your password?</a></p>
              </div>
  
              
          </div>
      </div>
  </div>
  

    {% include 'footer.html' %}
    {% include 'scripts.html' %}
    <script>
      function togglePasswordVisibility() {
          const passwordInput = document.getElementById("password");
          const icon = document.getElementById("togglePasswordIcon");
          
          if (passwordInput.type === "password") {
              passwordInput.type = "text";
              icon.classList.remove("fa-eye");
              icon.classList.add("fa-eye-slash");
          } else {
              passwordInput.type = "password";
              icon.classList.remove("fa-eye-slash");
              icon.classList.add("fa-eye");
          }
      }
      </script>


<!-- reCAPTCHA Implementation -->
<script src="https://www.google.com/recaptcha/api.js?render={{ RECAPTCHA_SITE_KEY }}" async defer></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const form = document.getElementById("login-form");
    
    if (!form) {
        console.error("Login form not found.");
        return;
    }
    
    form.addEventListener("submit", function (event) {
        event.preventDefault();
        
        grecaptcha.ready(function () {
            grecaptcha.execute("{{ RECAPTCHA_SITE_KEY }}", { action: "login" })
                .then(function (token) {
                    console.log("reCAPTCHA Token:", token);
                    
                    const recaptchaInput = document.getElementById("g-recaptcha-response");
                    if (recaptchaInput) {
                        recaptchaInput.value = token;
                        console.log("Token injected. Submitting form...");
                        form.submit();
                    } else {
                        console.error("Missing #g-recaptcha-response input.");
                    }
                })
                .catch(function (error) {
                    console.error("reCAPTCHA execution failed:", error);
                    alert("reCAPTCHA validation failed. Please refresh and try again.");
                });
        });
    });
});
</script>

<script>
    gtag('event', 'login_success', {
      method: 'email_password'  // or 'google', 'firebase', etc.
    });
  </script>
  
      
</body>
