<!-- login.html -->
{% include 'head.html' %}
<body>
    {% include 'navbar.html' %}
    
    <style>
        .grecaptcha-badge {
            visibility: visible !important;
            opacity: 1 !important;
        }
        
        /* Light Theme for Login Page */
        body {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%) !important;
            color: #2c3e50 !important;
            min-height: 100vh;
        }
        
        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            padding: 50px 40px;
            margin-top: 120px;
            margin-bottom: 60px;
            max-width: 450px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .login-signup-title {
            color: #446dcd !important;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 2.2rem;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-control {
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 16px 20px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #f8f9fa;
            height: auto;
        }
        
        .form-control:focus {
            border-color: #446dcd;
            box-shadow: 0 0 0 0.2rem rgba(68, 109, 205, 0.15);
            background: white;
            outline: none;
        }
        
        .form-control::placeholder {
            color: #6c757d;
            font-weight: 400;
        }
        
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #6c757d;
            transition: color 0.3s ease;
            z-index: 10;
        }
        
        .password-toggle:hover {
            color: #446dcd;
        }
        
        .btn-login {
            background: linear-gradient(135deg, #446dcd 0%, #4bb6d3 100%);
            border: none;
            padding: 16px 24px;
            font-weight: 600;
            border-radius: 12px;
            transition: all 0.3s ease;
            color: white;
            font-size: 1.1rem;
            width: 100%;
            margin-top: 10px;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(68, 109, 205, 0.3);
            color: white;
        }
        
        .btn-login:active {
            transform: translateY(0);
        }
        
        .alert-danger {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 25px;
            font-weight: 500;
        }
        
        .login-links {
            text-align: center;
            margin-top: 30px;
        }
        
        .login-links p {
            margin-bottom: 15px;
            color: #6c757d;
        }
        
        .login-links a {
            color: #446dcd;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        
        .login-links a:hover {
            color: #4bb6d3;
            text-decoration: none;
        }
        
        .divider {
            margin: 25px 0;
            text-align: center;
            position: relative;
        }
        
        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e9ecef;
        }
        
        .divider span {
            background: white;
            padding: 0 20px;
            color: #6c757d;
            font-size: 0.9rem;
        }
        
        /* Loading state */
        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        
        /* Responsive design */
        @media (max-width: 576px) {
            .login-container {
                margin: 80px 20px 40px;
                padding: 40px 30px;
            }
            
            .login-signup-title {
                font-size: 1.8rem;
            }
        }
    </style>

    <div class="container">
        <div class="login-container">
            <h1 class="login-signup-title">Welcome Back</h1>
            
            {% if error %}
                <div class="alert alert-danger" role="alert">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    {{ error }}
                </div>
            {% endif %}
            
            <form method="POST" action="{{ url_for('Login') }}" id="login-form">
                <div class="form-group">
                    <input type="email" 
                           class="form-control" 
                           name="email" 
                           placeholder="Enter your email address" 
                           required 
                           autofocus
                           autocomplete="email">
                </div>
                
                <div class="form-group position-relative">
                    <input type="password" 
                           class="form-control" 
                           name="password" 
                           id="password" 
                           placeholder="Enter your password" 
                           required
                           autocomplete="current-password">
                    <span class="password-toggle" onclick="togglePasswordVisibility()">
                        <i id="togglePasswordIcon" class="fas fa-eye"></i>
                    </span>
                </div>
                
                <input type="hidden" id="g-recaptcha-response" name="g-recaptcha-response">
                
                <button class="btn btn-login" type="submit" id="login-btn">
                    <span class="btn-text">Sign In</span>
                    <span class="btn-loading d-none">
                        <i class="fas fa-spinner fa-spin me-2"></i>Signing in...
                    </span>
                </button>
            </form>

            <div class="login-links">
                <p><a href="{{ url_for('reset_password') }}">Forgot your password?</a></p>
                
                <div class="divider">
                    <span>Don't have an account?</span>
                </div>
                
                <p><a href="/signup" class="fw-bold">Create your account</a></p>
            </div>
        </div>
    </div>
  

    {% include 'footer.html' %}
    {% include 'scripts.html' %}
    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById("password");
            const icon = document.getElementById("togglePasswordIcon");
            
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                passwordInput.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }
        
        // Enhanced form submission with loading state
        document.addEventListener("DOMContentLoaded", function() {
            const form = document.getElementById("login-form");
            const submitBtn = document.getElementById("login-btn");
            const btnText = submitBtn.querySelector(".btn-text");
            const btnLoading = submitBtn.querySelector(".btn-loading");
            
            if (form && submitBtn) {
                form.addEventListener("submit", function() {
                    submitBtn.disabled = true;
                    btnText.classList.add("d-none");
                    btnLoading.classList.remove("d-none");
                });
            }
        });
    </script>


<!-- reCAPTCHA Implementation -->
<script src="https://www.google.com/recaptcha/api.js?render={{ RECAPTCHA_SITE_KEY }}" async defer></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const form = document.getElementById("login-form");
    const submitBtn = document.getElementById("login-btn");
    const btnText = submitBtn?.querySelector(".btn-text");
    const btnLoading = submitBtn?.querySelector(".btn-loading");
    
    if (!form) {
        console.error("Login form not found.");
        return;
    }
    
    form.addEventListener("submit", function (event) {
        event.preventDefault();
        
        // Show loading state
        if (submitBtn) {
            submitBtn.disabled = true;
            if (btnText) btnText.classList.add("d-none");
            if (btnLoading) btnLoading.classList.remove("d-none");
        }
        
        grecaptcha.ready(function () {
            grecaptcha.execute("{{ RECAPTCHA_SITE_KEY }}", { action: "login" })
                .then(function (token) {
                    console.log("reCAPTCHA Token:", token);
                    
                    const recaptchaInput = document.getElementById("g-recaptcha-response");
                    if (recaptchaInput) {
                        recaptchaInput.value = token;
                        console.log("Token injected. Submitting form...");
                        form.submit();
                    } else {
                        console.error("Missing #g-recaptcha-response input.");
                        // Reset button state on error
                        if (submitBtn) {
                            submitBtn.disabled = false;
                            if (btnText) btnText.classList.remove("d-none");
                            if (btnLoading) btnLoading.classList.add("d-none");
                        }
                    }
                })
                .catch(function (error) {
                    console.error("reCAPTCHA execution failed:", error);
                    alert("reCAPTCHA validation failed. Please refresh and try again.");
                    // Reset button state on error
                    if (submitBtn) {
                        submitBtn.disabled = false;
                        if (btnText) btnText.classList.remove("d-none");
                        if (btnLoading) btnLoading.classList.add("d-none");
                    }
                });
        });
    });
});
</script>

<script>
    gtag('event', 'login_success', {
      method: 'email_password'  // or 'google', 'firebase', etc.
    });
  </script>
  
      
</body>
