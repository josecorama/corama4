{% include 'head.html' %}
<body>
    {% include 'navbar.html' %}

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    
    <style>
        body {
            font-family: 'Jost', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding-top: 100px;
        }

        .directory-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .directory-header {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .directory-title {
            font-size: 2rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 1rem;
        }

        .directory-subtitle {
            font-size: 1rem;
            color: #666;
            margin-bottom: 1.5rem;
        }

        .search-box {
            position: relative;
            margin-bottom: 1rem;
        }

        .search-input {
            width: 100%;
            padding: 1rem 1rem 1rem 3rem;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.15);
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 1.2rem;
        }

        .companies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        .company-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 1.5rem;
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .company-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }

        .company-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #f8f9fa;
        }

        .company-logo {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            background: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .company-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .company-logo-placeholder {
            font-size: 1.5rem;
            color: #999;
        }

        .company-info {
            flex: 1;
            min-width: 0;
        }

        .company-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 0.25rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .company-contact {
            font-size: 0.9rem;
            color: #666;
        }

        .company-details {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .detail-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            color: #666;
        }

        .detail-icon {
            color: #667eea;
            width: 20px;
            text-align: center;
        }

        .company-services {
            background: #f8f9ff;
            padding: 0.75rem;
            border-radius: 8px;
            border-left: 3px solid #667eea;
        }

        .services-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #667eea;
            text-transform: uppercase;
            margin-bottom: 0.25rem;
        }

        .services-text {
            font-size: 0.9rem;
            color: #2c3e50;
            line-height: 1.4;
        }

        .company-description {
            font-size: 0.9rem;
            color: #666;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .view-profile-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            text-align: center;
            transition: all 0.3s ease;
            margin-top: auto;
        }

        .view-profile-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .no-results {
            text-align: center;
            padding: 4rem 2rem;
            color: #999;
        }

        .no-results-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .loading {
            text-align: center;
            padding: 4rem 2rem;
            color: #999;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            background: #e9ecef;
            color: #666;
            margin-right: 0.5rem;
        }
    </style>

    <div class="directory-container">
        <div class="directory-header">
            <h1 class="directory-title">
                <i class="fas fa-users"></i> CORAMA Partner Directory
            </h1>
            <p class="directory-subtitle">
                Discover and connect with potential partners for government contracts
            </p>
            
            <div class="search-box">
                <i class="fas fa-search search-icon"></i>
                <input type="text" class="search-input" id="searchInput" placeholder="Search by company name, services, or description...">
            </div>
        </div>

        <div class="companies-grid" id="companiesGrid">
            <div class="loading">
                <i class="fas fa-spinner fa-spin" style="font-size: 3rem;"></i>
                <p style="margin-top: 1rem;">Loading companies...</p>
            </div>
        </div>
    </div>

    {% include 'footer.html' %}
    {% include 'scripts.html' %}

    <script>
        let allCompanies = [];
        let searchTimeout = null;

        document.addEventListener('DOMContentLoaded', function() {
            loadCompanies();
        });

        document.getElementById('searchInput').addEventListener('input', function() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                filterCompanies(this.value);
            }, 300);
        });

        async function loadCompanies() {
            try {
                const response = await fetch('/api/get_directory_companies');
                const data = await response.json();

                if (data.success) {
                    allCompanies = data.companies;
                    renderCompanies(allCompanies);
                } else {
                    showError('Failed to load companies');
                }
            } catch (error) {
                console.error('Error loading companies:', error);
                showError('An error occurred while loading companies');
            }
        }

        function filterCompanies(query) {
            if (!query.trim()) {
                renderCompanies(allCompanies);
                return;
            }

            const lowerQuery = query.toLowerCase();
            const filtered = allCompanies.filter(company => {
                const searchText = `${company.company} ${company.services} ${company.description}`.toLowerCase();
                return searchText.includes(lowerQuery);
            });

            renderCompanies(filtered);
        }

        function renderCompanies(companies) {
            const grid = document.getElementById('companiesGrid');

            if (companies.length === 0) {
                grid.innerHTML = `
                    <div class="no-results" style="grid-column: 1 / -1;">
                        <div class="no-results-icon">
                            <i class="fas fa-search"></i>
                        </div>
                        <h3>No companies found</h3>
                        <p>Try adjusting your search criteria</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = companies.map(company => `
                <div class="company-card" onclick="viewCompanyProfile('${company.user_id}')">
                    <div class="company-header">
                        <div class="company-logo">
                            ${company.logo_url ? 
                                `<img src="${company.logo_url}" alt="${company.company}">` : 
                                `<span class="company-logo-placeholder"><i class="fas fa-building"></i></span>`
                            }
                        </div>
                        <div class="company-info">
                            <div class="company-name">${escapeHtml(company.company)}</div>
                            <div class="company-contact">${escapeHtml(company.contact_name)}</div>
                        </div>
                    </div>

                    <div class="company-details">
                        ${company.team_size ? `
                            <div class="detail-row">
                                <i class="fas fa-users detail-icon"></i>
                                <span>${escapeHtml(company.team_size)}</span>
                            </div>
                        ` : ''}
                        ${company.years_in_business ? `
                            <div class="detail-row">
                                <i class="fas fa-calendar detail-icon"></i>
                                <span>${escapeHtml(company.years_in_business)} years in business</span>
                            </div>
                        ` : ''}
                        ${company.website ? `
                            <div class="detail-row">
                                <i class="fas fa-globe detail-icon"></i>
                                <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${escapeHtml(company.website)}</span>
                            </div>
                        ` : ''}
                    </div>

                    ${company.services ? `
                        <div class="company-services">
                            <div class="services-label">Services</div>
                            <div class="services-text">${escapeHtml(company.services)}</div>
                        </div>
                    ` : ''}

                    ${company.description ? `
                        <div class="company-description">${escapeHtml(company.description)}</div>
                    ` : ''}

                    <button class="view-profile-btn" onclick="event.stopPropagation(); viewCompanyProfile('${company.user_id}')">
                        View Full Profile <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
            `).join('');
        }

        function viewCompanyProfile(userId) {
            window.location.href = `/directory/company/${userId}`;
        }

        function showError(message) {
            const grid = document.getElementById('companiesGrid');
            grid.innerHTML = `
                <div class="no-results" style="grid-column: 1 / -1;">
                    <div class="no-results-icon">
                        <i class="fas fa-exclamation-circle"></i>
                    </div>
                    <h3>Error</h3>
                    <p>${message}</p>
                </div>
            `;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
