{% include 'head.html' %}
<body>
    {% include 'navbar.html' %}

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    
    <style>
        body {
            font-family: 'Jost', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding-top: 100px;
        }

        .profile-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            color: #764ba2;
            transform: translateX(-4px);
        }

        .profile-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .profile-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 3rem 2rem;
            color: white;
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .profile-logo {
            width: 120px;
            height: 120px;
            border-radius: 16px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .profile-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 0.5rem;
        }

        .profile-logo-placeholder {
            font-size: 3rem;
            color: #667eea;
        }

        .profile-header-info {
            flex: 1;
        }

        .profile-company-name {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .profile-contact-name {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 1rem;
        }

        .profile-quick-links {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .quick-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: rgba(255,255,255,0.2);
            border-radius: 8px;
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .quick-link:hover {
            background: rgba(255,255,255,0.3);
            color: white;
            transform: translateY(-2px);
        }

        .profile-body {
            padding: 2rem;
        }

        .profile-section {
            margin-bottom: 2rem;
            padding-bottom: 2rem;
            border-bottom: 2px solid #f8f9fa;
        }

        .profile-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .section-icon {
            color: #667eea;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .info-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            font-size: 1rem;
            color: #2c3e50;
            font-weight: 500;
        }

        .info-value a {
            color: #667eea;
            text-decoration: none;
        }

        .info-value a:hover {
            text-decoration: underline;
        }

        .description-text {
            font-size: 1rem;
            color: #666;
            line-height: 1.8;
        }

        .services-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .service-tag {
            padding: 0.5rem 1rem;
            background: #f8f9ff;
            border: 2px solid #667eea;
            border-radius: 20px;
            color: #667eea;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .certifications-list {
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: 12px;
            border-left: 4px solid #27ae60;
        }

        .certifications-text {
            font-size: 1rem;
            color: #2c3e50;
            line-height: 1.8;
            white-space: pre-wrap;
        }

        .projects-text {
            font-size: 1rem;
            color: #666;
            line-height: 1.8;
            white-space: pre-wrap;
        }

        .contact-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn-contact {
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .btn-primary-contact {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary-contact:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
            color: white;
        }

        .btn-secondary-contact {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-secondary-contact:hover {
            background: #f8f9ff;
            transform: translateY(-2px);
        }

        .loading {
            text-align: center;
            padding: 4rem 2rem;
            color: #999;
        }

        .error-message {
            text-align: center;
            padding: 4rem 2rem;
            color: #e74c3c;
        }

        .btn-add-partner {
            background: #10b981;
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .btn-add-partner:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
            color: white;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 2px solid #f8f9fa;
        }
    </style>

    <div class="profile-container">
        <a href="/directory" class="back-button">
            <i class="fas fa-arrow-left"></i> Back to Directory
        </a>

        <div id="profileContent">
            <div class="loading">
                <i class="fas fa-spinner fa-spin" style="font-size: 3rem;"></i>
                <p style="margin-top: 1rem;">Loading company profile...</p>
            </div>
        </div>
    </div>

    {% include 'footer.html' %}
    {% include 'scripts.html' %}

    <script>
        const companyUserId = '{{ company_user_id }}';

        document.addEventListener('DOMContentLoaded', function() {
            loadCompanyProfile();
        });

        async function loadCompanyProfile() {
            try {
                const response = await fetch('/api/get_directory_companies');
                const data = await response.json();

                if (data.success) {
                    const company = data.companies.find(c => c.user_id === companyUserId);
                    
                    if (company) {
                        renderProfile(company);
                    } else {
                        showError('Company not found');
                    }
                } else {
                    showError('Failed to load company profile');
                }
            } catch (error) {
                console.error('Error loading company profile:', error);
                showError('An error occurred while loading the profile');
            }
        }

        function renderProfile(company) {
            const content = document.getElementById('profileContent');
            
            const services = company.services ? company.services.split(',').map(s => s.trim()).filter(s => s) : [];
            
            content.innerHTML = `
                <div class="profile-card">
                    <div class="profile-header">
                        <div class="profile-logo">
                            ${company.logo_url ? 
                                `<img src="${company.logo_url}" alt="${escapeHtml(company.company)}">` : 
                                `<span class="profile-logo-placeholder"><i class="fas fa-building"></i></span>`
                            }
                        </div>
                        <div class="profile-header-info">
                            <div class="profile-company-name">${escapeHtml(company.company)}</div>
                            <div class="profile-contact-name">${escapeHtml(company.contact_name)}</div>
                            <div class="profile-quick-links">
                                ${company.website ? `
                                    <a href="${escapeHtml(company.website)}" target="_blank" class="quick-link">
                                        <i class="fas fa-globe"></i> Website
                                    </a>
                                ` : ''}
                                ${company.linkedin_url ? `
                                    <a href="${escapeHtml(company.linkedin_url)}" target="_blank" class="quick-link">
                                        <i class="fab fa-linkedin"></i> LinkedIn
                                    </a>
                                ` : ''}
                                ${company.email ? `
                                    <a href="mailto:${escapeHtml(company.email)}" class="quick-link">
                                        <i class="fas fa-envelope"></i> Email
                                    </a>
                                ` : ''}
                                ${company.phone ? `
                                    <a href="tel:${escapeHtml(company.phone)}" class="quick-link">
                                        <i class="fas fa-phone"></i> Call
                                    </a>
                                ` : ''}
                            </div>
                        </div>
                    </div>

                    <div class="profile-body">
                        <!-- Company Overview -->
                        <div class="profile-section">
                            <div class="section-title">
                                <i class="fas fa-info-circle section-icon"></i>
                                Company Overview
                            </div>
                            <div class="info-grid">
                                ${company.team_size ? `
                                    <div class="info-item">
                                        <div class="info-label">Team Size</div>
                                        <div class="info-value">${escapeHtml(company.team_size)}</div>
                                    </div>
                                ` : ''}
                                ${company.years_in_business ? `
                                    <div class="info-item">
                                        <div class="info-label">Years in Business</div>
                                        <div class="info-value">${escapeHtml(company.years_in_business)} years</div>
                                    </div>
                                ` : ''}
                            </div>
                            ${company.description ? `
                                <div style="margin-top: 1.5rem;">
                                    <div class="description-text">${escapeHtml(company.description)}</div>
                                </div>
                            ` : ''}
                        </div>

                        <!-- Services -->
                        ${services.length > 0 ? `
                            <div class="profile-section">
                                <div class="section-title">
                                    <i class="fas fa-briefcase section-icon"></i>
                                    Services Offered
                                </div>
                                <div class="services-tags">
                                    ${services.map(service => `
                                        <div class="service-tag">${escapeHtml(service)}</div>
                                    `).join('')}
                                </div>
                            </div>
                        ` : ''}

                        <!-- Certifications -->
                        ${company.certifications ? `
                            <div class="profile-section">
                                <div class="section-title">
                                    <i class="fas fa-certificate section-icon"></i>
                                    Certifications & Credentials
                                </div>
                                <div class="certifications-list">
                                    <div class="certifications-text">${escapeHtml(company.certifications)}</div>
                                </div>
                            </div>
                        ` : ''}

                        <!-- Past Projects -->
                        ${company.past_projects ? `
                            <div class="profile-section">
                                <div class="section-title">
                                    <i class="fas fa-project-diagram section-icon"></i>
                                    Past Projects & Experience
                                </div>
                                <div class="projects-text">${escapeHtml(company.past_projects)}</div>
                            </div>
                        ` : ''}

                        <!-- Contact Information -->
                        <div class="profile-section">
                            <div class="section-title">
                                <i class="fas fa-address-card section-icon"></i>
                                Contact Information
                            </div>
                            <div class="info-grid">
                                ${company.email ? `
                                    <div class="info-item">
                                        <div class="info-label">Email</div>
                                        <div class="info-value">
                                            <a href="mailto:${escapeHtml(company.email)}">${escapeHtml(company.email)}</a>
                                        </div>
                                    </div>
                                ` : ''}
                                ${company.phone ? `
                                    <div class="info-item">
                                        <div class="info-label">Phone</div>
                                        <div class="info-value">
                                            <a href="tel:${escapeHtml(company.phone)}">${escapeHtml(company.phone)}</a>
                                        </div>
                                    </div>
                                ` : ''}
                                ${company.website ? `
                                    <div class="info-item">
                                        <div class="info-label">Website</div>
                                        <div class="info-value">
                                            <a href="${escapeHtml(company.website)}" target="_blank">${escapeHtml(company.website)}</a>
                                        </div>
                                    </div>
                                ` : ''}
                                ${company.linkedin_url ? `
                                    <div class="info-item">
                                        <div class="info-label">LinkedIn</div>
                                        <div class="info-value">
                                            <a href="${escapeHtml(company.linkedin_url)}" target="_blank">View Profile</a>
                                        </div>
                                    </div>
                                ` : ''}
                            </div>
                            <div class="contact-actions" style="margin-top: 2rem;">
                                ${company.email ? `
                                    <a href="mailto:${escapeHtml(company.email)}" class="btn-contact btn-primary-contact">
                                        <i class="fas fa-envelope"></i> Send Email
                                    </a>
                                ` : ''}
                                ${company.phone ? `
                                    <a href="tel:${escapeHtml(company.phone)}" class="btn-contact btn-secondary-contact">
                                        <i class="fas fa-phone"></i> Call Now
                                    </a>
                                ` : ''}
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="action-buttons">
                            <button onclick="addToProposal('${company.user_id}')" class="btn-add-partner">
                                <i class="fas fa-user-plus"></i> Add as Partner to Proposal
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function addToProposal(userId) {
            // Store the selected partner in localStorage for use in proposal builder
            localStorage.setItem('selected_directory_partner', userId);
            
            // Show success message
            alert('Partner added! Go to AI Assistant → Build Team (Screen 2) to add this partner to your proposal.');
            
            // Optionally redirect to proposal builder
            if (confirm('Would you like to go to the proposal builder now?')) {
                window.location.href = '/ai-assistant';
            }
        }

        function showError(message) {
            const content = document.getElementById('profileContent');
            content.innerHTML = `
                <div class="error-message">
                    <i class="fas fa-exclamation-circle" style="font-size: 3rem; margin-bottom: 1rem;"></i>
                    <h3>Error</h3>
                    <p>${message}</p>
                    <a href="/directory" class="btn-contact btn-primary-contact" style="margin-top: 1rem;">
                        <i class="fas fa-arrow-left"></i> Back to Directory
                    </a>
                </div>
            `;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
